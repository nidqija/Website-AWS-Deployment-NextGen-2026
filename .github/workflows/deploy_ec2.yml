name: Deploy to EC2

on:
  push:
    branches: [ master ] # Change to 'main' if your default branch is main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Clone repository if not present, otherwise pull latest
            if [ ! -d "/var/www/my-app/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git /var/www/my-app
            fi

            cd /var/www/my-app
            git reset --hard origin/master
            git pull origin master

            # 2. Build and restart backend
            if [ -d "backend" ]; then cd backend; fi
            npm ci --production
            pm2 restart node-api || pm2 start index.js --name "node-api"

            # 3. Build and deploy frontend
            cd /var/www/my-app
            if [ -d "frontend" ]; then cd frontend; fi
            npm ci
            npm run build

            # 4. Copy build artifacts to Nginx web root
            BUILD_DIR=$([ -d "dist" ] && echo "dist" || echo "build")
            sudo cp -r $BUILD_DIR/* /var/www/frontend/

            # 5. Reload Nginx
            sudo systemctl reload nginx