name: Deploy to EC2

on:
  push:
    branches: [ master ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Clone repository if not present, otherwise pull latest
            if [ ! -d "/var/www/my-app/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git /var/www/my-app
            fi

            cd /var/www/my-app
            git fetch origin master
            git reset --hard origin/master

            # 2. Install dependencies (including Vite for build)
            npm ci

            # 3. Build frontend to dist/
            npm run build

            # 4. Start or restart Node.js backend API with PM2
            pm2 restart node-api || pm2 start server.js --name "node-api"

            # 5. Copy frontend build artifacts to Nginx web root
            sudo cp -r dist/* /var/www/frontend/

            # 6. Reload Nginx
            sudo systemctl reload nginx